
<div class="max-w-6xl mx-auto p-6 bg-white rounded-lg shadow">

  <div class="grid grid-cols-1 md:grid-cols-2 gap-8">

    <div>

      <h1 class="text-3xl font-bold text-gray-900 mb-6">
        Horóscopo Chino
      </h1>

      <form [formGroup]="formulario">

        <div class="mb-4">
          <label class="block mb-2 font-medium">Nombre</label>
          <input type="text" formControlName="nombre"
            placeholder="Nombre"
            class="bg-gray-50 border rounded-lg w-full p-2.5">
        </div>

        <div class="mb-4">
          <label class="block mb-2 font-medium">Apellido paterno</label>
          <input type="text" formControlName="apaterno"
            placeholder="Apellido paterno"
            class="bg-gray-50 border rounded-lg w-full p-2.5">
        </div>

        <div class="mb-4">
          <label class="block mb-2 font-medium">Apellido materno</label>
          <input type="text" formControlName="amaterno"
            placeholder="Apellido materno"
            class="bg-gray-50 border rounded-lg w-full p-2.5">
        </div>

        <div class="grid grid-cols-3 gap-3 mb-4">

          <div>
            <label class="block mb-2 font-medium">Día</label>
            <input type="number" formControlName="dia"
              placeholder="Día"
              class="bg-gray-50 border rounded-lg w-full p-2.5">
          </div>

          <div>
            <label class="block mb-2 font-medium">Mes</label>
            <input type="number" formControlName="mes"
              placeholder="Mes"
              class="bg-gray-50 border rounded-lg w-full p-2.5">
          </div>

          <div>
            <label class="block mb-2 font-medium">Año</label>
            <input type="number" formControlName="anio"
              placeholder="Año"
              class="bg-gray-50 border rounded-lg w-full p-2.5">
          </div>

        </div>

        <div class="mb-6">
          <label class="block mb-2 font-medium">Sexo</label>

          <label class="mr-5">
            <input type="radio" formControlName="sexo"
              value="Masculino">
            Masculino
          </label>

          <label>
            <input type="radio" formControlName="sexo"
              value="Femenino">
            Femenino
          </label>
        </div>

        <!-- BOTon -->
        <div class="flex flex-wrap gap-3">

          <button type="button" (click)="imprimir()"
            class="bg-red-700 hover:bg-green-800 text-white
                   rounded-lg px-5 py-2.5">
            Imprimir
          </button>

          <button type="button" (click)="verRegistros()"
            class="bg-red-700 hover:bg-green-800 text-white
                   rounded-lg px-5 py-2.5">
            Ver registros
          </button>

          <button type="button" (click)="regresar()"
            class="bg-red-700 hover:bg-green-800 text-white
                   rounded-lg px-5 py-2.5">
            Limpiar
          </button>

        </div>

      </form>

    </div>

    <div class="bg-red-50 rounded-lg p-6 text-center">

      <h2 class="text-2xl font-bold text-gray-900 mb-6">
        Resultado
      </h2>

      <div *ngIf="signo !== ''; 
      else sinResultado">

        <div class="w-40 h-40 mx-auto rounded-full
                    bg-red-600 flex items-center justify-center
                    mb-6 shadow-md">

          <span class="text-7xl">
            {{ emoji }}
          </span>

        </div>

        <h3 class="text-2xl font-bold text-gray-900 mb-3">
          {{ alumno.nombre }}
          {{ alumno.apaterno }}
          {{ alumno.amaterno }}
        </h3>

        <p class="text-lg text-gray-700 mb-3">
          Edad: {{ edad }} años
        </p>

        <p class="text-2xl font-bold text-gray-900">
          {{ signo }}
        </p>

      </div>

      <ng-template #sinResultado>

        <div class="w-40 h-40 mx-auto rounded-full
                    bg-red-600 flex items-center justify-center
                    mb-6">

          <span class="text-6xl">🐉</span>

        </div>

      </ng-template>

    </div>

  </div>

</div>
