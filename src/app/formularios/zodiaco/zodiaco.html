<div class="max-w-5xl mx-auto p-6">

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

    <!-- TARJETA DE DATOS PERSONALES -->
    <div class="bg-white p-6 rounded-lg shadow">

      <h1 class="text-2xl font-bold text-gray-900 mb-6">
        Datos personales
      </h1>

      <form [formGroup]="formulario">

        <div class="mb-4">
          <label for="nombre" class="block mb-2 text-sm font-medium text-gray-900">
            Nombre
          </label>

          <input type="text" id="nombre" formControlName="nombre"
            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5"
            placeholder="Nombre">
        </div>

        <div class="mb-4">
          <label for="apaterno" class="block mb-2 text-sm font-medium text-gray-900">
            Apellido paterno
          </label>

          <input type="text" id="apaterno" formControlName="apaterno"
            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5"
            placeholder="Apellido paterno">
        </div>

        <div class="mb-4">
          <label for="amaterno" class="block mb-2 text-sm font-medium text-gray-900">
            Apellido materno
          </label>

          <input type="text" id="amaterno" formControlName="amaterno"
            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5"
            placeholder="Apellido materno">
        </div>

        <h2 class="text-lg font-bold text-gray-900 mb-4">
          Fecha de nacimiento
        </h2>

        <div class="grid grid-cols-3 gap-3 mb-5">

          <div>
            <label for="dia" class="block mb-2 text-sm font-medium text-gray-900">
              Día
            </label>

            <input type="number" id="dia" formControlName="dia"
              class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5"
              placeholder="Día">
          </div>

          <div>
            <label for="mes" class="block mb-2 text-sm font-medium text-gray-900">
              Mes
            </label>

            <input type="number" id="mes" formControlName="mes"
              class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5"
              placeholder="Mes">
          </div>

          <div>
            <label for="anio" class="block mb-2 text-sm font-medium text-gray-900">
              Año
            </label>

            <input type="number" id="anio" formControlName="anio"
              class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5"
              placeholder="Año">
          </div>

        </div>

        <h2 class="text-lg font-bold text-gray-900 mb-3">
          Sexo
        </h2>

        <div class="mb-5">

          <label class="mr-5 text-sm text-gray-900">
            <input type="radio" formControlName="sexo" value="Masculino">
            Masculino
          </label>

          <label class="text-sm text-gray-900">
            <input type="radio" formControlName="sexo" value="Femenino">
            Femenino
          </label>

        </div>

        <div class="flex justify-center mt-6">
          <button type="button" (click)="imprimir()"
            class="text-white bg-blue-700 hover:bg-blue-800 font-medium rounded-lg text-sm px-6 py-2.5">
            Imprimir
          </button>
        </div>

      </form>

    </div>


    <!-- TARJETA DE RESULTADOS -->
    <div class="bg-white p-6 rounded-lg shadow text-center">

      <h1 class="text-2xl font-bold text-gray-900 mb-6">
        Resultado
      </h1>

      <div class="mt-4">

        <h2 class="text-xl font-bold text-gray-900">
          Hola {{alumno.nombre}} {{alumno.apaterno}} {{alumno.amaterno}}
        </h2>

        <p class="text-lg text-gray-700 mt-4">
          Tienes {{edad}} años
        </p>

        <p class="text-lg text-gray-700 mt-6">
          Tu signo zodiacal es:
        </p>

        <h2 class="text-2xl font-bold text-gray-900 mt-2">
          {{signo}}
        </h2>

        <div [hidden]="emoji == ''"
          class="mx-auto mt-5 w-32 h-32 rounded-full flex items-center justify-center shadow-md"
          [style.background-color]="color">

          <span class="text-6xl">
            {{emoji}}
          </span>

        </div>

      </div>

    </div>

  </div>

</div>
